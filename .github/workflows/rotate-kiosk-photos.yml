name: Rotate kiosk photos

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs a few minutes under load —
    # fine for this, since it's not time-critical.
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/rotate-kiosk-photos.mjs
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
